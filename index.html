<style>
/* Layout: header → progress rings → (calendar | 3-column board). Under 760px the board becomes tabs and the calendar a week strip. */
:root {
  --bg: #000000;
  --surface: #1C1C1E;
  --surface-2: #2C2C2E;
  --surface-3: #3A3A3C;
  --surface-4: #48484A;
  --sep: #38383A;
  --fg: #F5F5F7;
  --fg-2: #A1A1A6;
  --fg-3: #8E8E93;
  --icon: #98989D;
  --blue: #0071E3;
  --blue-text: #409CFF;
  --orange: #FF9F0A;
  --green: #30D158;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body {
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  letter-spacing: -0.015em;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--blue-text); outline-offset: 2px; }
input::placeholder { color: var(--fg-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.boot { color: var(--fg-2); text-align: center; padding: 30vh 16px; margin: 0; }

.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding-block: 32px 64px;
  padding-left: max(32px, env(safe-area-inset-left, 0px));
  padding-right: max(32px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.title-group { flex: 1; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; min-width: 0; }
.title-group h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.03em; }
.title-group .sub { font-size: 16px; font-weight: 500; color: var(--fg-2); }
.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { height: 36px; padding: 0 14px; border-radius: 10px; background: var(--surface); color: var(--fg); font-size: 14px; font-weight: 500; }
.seg { display: flex; padding: 3px; border-radius: 10px; background: var(--surface); }
.seg button { min-height: 32px; padding: 0 14px; border-radius: 8px; color: var(--fg-2); font-size: 14px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--blue); color: #FFFFFF; font-weight: 600; }
.account { display: flex; align-items: center; gap: 6px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-3); object-fit: cover; }
.badge { height: 28px; padding: 0 10px; border-radius: 999px; background: var(--surface-2); color: var(--fg-2); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; }

.notice { background: var(--surface); border-radius: 12px; padding: 12px 16px; color: var(--fg-2); font-size: 13px; line-height: 1.5; }
.notice strong { color: var(--fg); font-weight: 600; }

/* Progress */
.progress { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.progress.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pcard { background: var(--surface); border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 16px; min-width: 0; }
.ring-box { position: relative; width: 64px; height: 64px; flex: none; }
.ring-box svg { width: 100%; height: 100%; display: block; }
.ring-box .track { stroke: var(--surface-2); }
.ring-box .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
.ptext { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ptext .head { display: flex; align-items: baseline; gap: 6px; }
.ptext h2 { margin: 0; font-size: 15px; font-weight: 600; }
.ptext .muted, .ptext .counts { font-size: 12px; color: var(--fg-2); }
.ptext .frac { font-size: 13px; color: var(--fg-2); }
.ptext .frac strong { color: var(--fg); font-weight: 600; }
.ptext .counts { display: flex; gap: 10px; }

/* Main row */
.main { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; }
.panel { background: var(--surface); border-radius: 16px; padding: 14px; }
.cal { flex: 1 1 280px; max-width: 300px; display: flex; flex-direction: column; }
.cal-head { display: flex; align-items: center; justify-content: space-between; height: 36px; margin-bottom: 8px; }
.cal-head h2 { margin: 0 auto 0 4px; font-size: 15px; font-weight: 600; }
.cal-more { display: none; }
.hol-name { color: var(--fg-3); }
.hol-name.off { color: #FF6961; }
.nav { display: flex; margin-right: -6px; }
.nav button { width: 44px; height: 44px; margin: -4px 0; border-radius: 50%; color: var(--blue-text); display: flex; align-items: center; justify-content: center; }
.dow, .grid7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.dow { text-align: center; font-size: 11px; font-weight: 600; color: var(--fg-2); padding-bottom: 4px; }
.day { height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.day .n { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-variant-numeric: tabular-nums; }
.dow .sun, .day.sun .n, .day.sun .w, .day.hol .n, .day.hol .w { color: #FF6961; }
.dow .sat, .day.sat .n, .day.sat .w { color: var(--blue-text); }
.day.today .n { font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--blue-text); }
.day.sel .n { background: var(--blue); color: #FFFFFF; font-weight: 600; }
.dots { display: flex; gap: 2px; height: 5px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; display: block; }
.cal-foot { margin-top: auto; padding: 12px 4px 0; border-top: 1px solid var(--sep); display: flex; justify-content: space-between; font-size: 13px; }
.cal-foot span:first-child { color: var(--fg-2); }
.cal-foot span:last-child { font-weight: 600; }
.cal-month { margin-bottom: 12px; }
.week { display: none; }

.board { flex: 999 1 600px; min-width: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; }
.board > .tabs, .board > .composer-m { display: none; }
.col { flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.col-head { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px; }
.col-head .dot { width: 8px; height: 8px; border-radius: 50%; }
.col-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
.count { margin-left: auto; min-width: 24px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--surface-2); color: var(--fg-2); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.empty { margin: 0; padding: 16px 8px; text-align: center; font-size: 13px; color: var(--fg-2); }

/* Composer */
.composer { background: var(--surface-2); border-radius: 12px; padding: 0 4px 8px 12px; display: flex; flex-direction: column; gap: 2px; }
.composer-row { display: flex; align-items: center; gap: 4px; }
.composer-input { flex: 1; min-width: 0; height: 44px; border: 0; padding: 0; background: transparent; font-size: 15px; }
.composer-input:focus-visible { outline: none; }
.add-btn { flex: none; width: 44px; height: 44px; margin: 2px 0 2px 10px; border-radius: 50%; background: var(--blue); color: #FFFFFF; display: flex; align-items: center; justify-content: center; }
.chips { display: flex; flex-wrap: wrap; gap: 2px; margin-left: -4px; }
.chip { min-width: 0; white-space: nowrap; overflow: hidden; height: 32px; padding: 0 7px; border-radius: 999px; color: var(--fg-2); font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
.chip i, .cat i { width: 7px; height: 7px; border-radius: 50%; display: block; flex: none; }
.chip[aria-pressed="true"] { background: var(--surface-4); color: var(--fg); font-weight: 600; }

/* Time pill + iOS-style wheel */
.time-pill { flex: none; height: 36px; min-width: 36px; padding: 0 8px; margin: 4px 0; border-radius: 999px; color: var(--fg-2); display: flex; align-items: center; justify-content: center; }
.time-pill:hover { color: var(--fg); }
.time-pill.set { background: var(--surface-3); color: var(--fg); font-size: 14px; font-weight: 600; padding: 0 11px; }
.time-pill[aria-expanded="true"] { background: var(--surface-4); color: var(--fg); }
.tw { background: var(--surface); border-radius: 12px; padding: 8px; margin: 2px 0 6px; display: grid; grid-template-columns: minmax(52px, 1fr) minmax(0, 250px) minmax(52px, 1fr); align-items: center; gap: 6px; user-select: none; -webkit-user-select: none; }
.composer .tw { margin-left: -4px; }
.tw-main { grid-column: 2; grid-row: 1; min-width: 0; display: flex; flex-direction: column; }
.tw-body { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; height: 170px; }
.tw-band { position: absolute; left: 8px; right: 8px; top: 50%; height: 34px; transform: translateY(-50%); border-radius: 9px; background: var(--surface-3); }
.tw-col { position: relative; flex: 1; min-width: 0; max-width: 96px; height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: ns-resize; touch-action: none; border-radius: 9px;
  -webkit-mask-image: linear-gradient(transparent, #000 28%, #000 72%, transparent); mask-image: linear-gradient(transparent, #000 28%, #000 72%, transparent); }
.tw-col:focus-visible { outline: 2px solid var(--blue-text); outline-offset: -2px; }
.tw-item { height: 34px; line-height: 34px; font-variant-numeric: tabular-nums; pointer-events: none; }
.tw-ap { flex: 0.8; }
.tw-ap .tw-item.d0, .tw-ap .tw-item.d1 { font-size: 17px; }
.tw-ap .tw-item.d2 { visibility: hidden; }
.tw-item.d0 { color: var(--fg); font-size: 26px; font-weight: 600; }
.tw-item.d1 { color: var(--fg-2); font-size: 20px; }
.tw-item.d2 { color: var(--fg-3); font-size: 17px; }
.tw-colon { position: relative; font-size: 22px; font-weight: 600; padding-bottom: 2px; }
.tw-ok { grid-column: 3; grid-row: 1; justify-self: end; white-space: nowrap; width: 100%; max-width: 72px; height: 44px; padding: 0 8px; font-size: 15px; border-radius: 10px; }
.tw-clear { grid-column: 3; grid-row: 1; white-space: nowrap; align-self: end; justify-self: end; width: 100%; max-width: 72px; text-align: center; height: 30px; padding: 0 6px; border-radius: 8px; color: var(--fg-3); font-size: 12px; font-weight: 500; }
.tw-clear:hover { color: var(--fg); }
.edit-row { display: flex; align-items: center; gap: 8px; }
.edit-row .field { flex: 1; min-width: 0; }
.edit-row .time-pill { margin: 0; height: 40px; min-width: 64px; border-radius: 8px; }
.edit-row .time-pill:not(.set) { background: var(--surface); }
.edit-del { flex: none; width: 40px; height: 40px; border-radius: 8px; color: #FF6961; display: flex; align-items: center; justify-content: center; }
.edit-del svg { width: 20px; height: 20px; }
.edit-del:hover { background: var(--surface); }
.date-field { position: relative; flex: 1; min-width: 0; height: 40px; border-radius: 8px; padding: 0 10px; background: var(--surface); display: flex; align-items: center; font-size: 14px; cursor: pointer; }
.date-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.date-field input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; cursor: pointer; }
.date-field input::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.date-field:focus-within { outline: 2px solid var(--blue-text); outline-offset: 0; }

/* Cards: swipe left to reveal delete */
.swipe { position: relative; border-radius: 12px; overflow: hidden; user-select: none; -webkit-user-select: none; flex: none; }
.swipe-del { position: absolute; top: 0; right: 0; bottom: 0; width: 88px; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; background: #D92D20; border-radius: 0 12px 12px 0; visibility: hidden; transition: width .15s ease; }
.swipe.open .swipe-del, .swipe.swiping .swipe-del { visibility: visible; }
.swipe.far .swipe-del { border-radius: 12px; }
.swipe.far .swipe-del { width: 100%; }
.swipe.fwd .swipe-del { visibility: hidden; }
.swipe-move { position: absolute; inset: 0; padding-left: 18px; color: #FFFFFF; display: none; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; border-radius: 12px; background: var(--surface-3); transition: background .15s ease; }
.swipe.fwd .swipe-move { display: flex; }
.swipe.go .swipe-move.to-doing { background: var(--orange); }
.swipe.go .swipe-move.to-done { background: var(--green); color: #1D1D1F; }
.card { position: relative; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 4px; transition: transform .22s ease; touch-action: pan-y; }
.swipe.open .card { transform: translateX(-88px); }

function authMessage(e) {
  const code = e && e.code || '';
  if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return '';
  if (code === 'auth/unauthorized-domain') return L.eDomain;
  if (code === 'auth/network-request-failed') return L.eNet;
  if (code === 'auth/operation-not-allowed' || code === 'auth/configuration-not-found') return L.eOff;
  if (code === 'auth/invalid-api-key' || code === 'auth/api-key-not-valid.-please-pass-a-valid-api-key.') return L.eKey;
  if (code === 'auth/web-storage-unsupported') return L.eStorage;
  return L.eLogin(code || (e && e.message) || L.unknown);
}

async function initCloud() {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  let A, F, initializeApp;
  try {
    const mods = await Promise.all([
      import(base + 'firebase-app.js'),
      import(base + 'firebase-auth.js'),
      import(base + 'firebase-firestore.js')
    ]);
    initializeApp = mods[0].initializeApp; A = mods[1]; F = mods[2];
  } catch (e) {
    S.mode = 'fatal';
    S.error = L.eApp;
    render();
    return;
  }
  const app = initializeApp(firebaseConfig);
  const auth = A.getAuth(app);
  let db;
  try {
    db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  } catch (e) {
    db = F.getFirestore(app);
  }
  const provider = new A.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });

  signIn = async () => {
    S.error = '';
    try {
      await A.signInWithPopup(auth, provider);
    } catch (e) {
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) {
        await A.signInWithRedirect(auth, provider);
        return;
      }
      S.error = authMessage(e);
      render();
    }
  };
  signOutFn = () => A.signOut(auth);
  A.getRedirectResult(auth).catch(e => { S.error = authMessage(e); render(); });

  // Some in-app browsers (messengers, app webviews) block the storage sign-in needs and never answer.
  setTimeout(() => {
    if (S.mode !== 'loading') return;
    S.mode = 'fatal';
    S.error = L.eInApp;
    render();
  }, 10000);

  let unsub = null;
  A.onAuthStateChanged(auth, user => {
    if (unsub) { unsub(); unsub = null; }
    S.user = user;
    S.tasks = [];
    if (!user) { S.mode = 'login'; store = null; render(); return; }
    S.mode = 'app';
    const col = F.collection(db, 'users', user.uid, 'tasks');
    store = {
      add: t => F.addDoc(col, t),
      update: (id, p) => F.updateDoc(F.doc(col, id), p),
      remove: id => F.deleteDoc(F.doc(col, id))
    };
    unsub = F.onSnapshot(col, snap => {
      S.tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, () => {
      showToast(L.loadFail);
    });
    render();
  });
}

  const counts = {};
  for (const t of S.tasks) if (t.date === key) counts[t.cat] = (counts[t.cat] || 0) + 1;
  return Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 3)
    .map(k => `<i style="background:${(CAT[k] || CAT.life).color};opacity:${counts[k] >= 3 ? 1 : counts[k] === 2 ? 0.6 : 0.28}"></i>`).join('');
}

function relLabel(k) {
  const t = today();
  for (const n of [0, 1, -1]) if (k === addDays(t, n)) return cap(REL.format(n, 'day'));
  return F_MD.format(parse(k));
}

function visibleTasks() {
  const list = S.view === 'day' ? S.tasks.filter(t => t.date === S.sel) : S.tasks.slice();
  return list.sort((a, b) => (a.date || '').localeCompare(b.date || '')
    || (a.time || '99:99').localeCompare(b.time || '99:99')
    || (a.created || 0) - (b.created || 0));
}

/* Time picker (iOS-style wheel). target 'tn' / 'tnm' = new task (S.draftTime), 'te' = task being edited (S.edit.time). */
function getTime(target) { return target === 'te' ? (S.edit && S.edit.time) : S.draftTime; }
function setTime(target, t) { if (target === 'te') { if (S.edit) S.edit.time = t; } else S.draftTime = t; }
const CLOCK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const ITEM_H = 34;

function timePill(target) {
  const t = getTime(target);
  const open = S.timeOpen === target;
  const label = t ? L.timeChange(showTime(t)) : L.timeAdd;
  return `<button type="button" class="time-pill ${t ? 'set' : ''}" data-act="time-open" data-target="${target}" aria-haspopup="dialog" aria-expanded="${open}" aria-label="${label}">${t ? `<span class="num">${showTime(t)}</span>` : CLOCK}</button>`;
}

// 12-hour wheel like the iPhone alarm: [AM/PM] [1–12] : [00–59]. Stored time stays 24-hour ("HH:MM").
const F_HM = dtf({ hour: 'numeric', minute: '2-digit', hour12: true });
const PERIODS = [9, 21].map(h => (dtf({ hour: 'numeric', hour12: true }).formatToParts(new Date(2024, 0, 1, h)).find(p => p.type === 'dayPeriod') || { value: h < 12 ? 'AM' : 'PM' }).value);
const showTime = t => t ? F_HM.format(new Date(2024, 0, 1, t.h, t.m)) : '';
const h12 = h => String(h % 12 || 12);
function wheelVal(part, t) { return part === 'ap' ? (t.h >= 12 ? 1 : 0) : part === 'h' ? t.h : t.m; }
function wheelItems(part, val) {
  let out = '';
  for (let o = -2; o <= 2; o++) {
    let label;
    if (part === 'ap') label = PERIODS[val + o] || '';
    else if (part === 'h') label = h12((val + o + 24) % 24);
    else label = pad((val + o + 60) % 60);
    out += `<span class="tw-item d${Math.abs(o)}">${label}</span>`;
  }
  return out;
}

function timeWheel(target) {
  if (S.timeOpen !== target) return '';
  const t = getTime(target) || nowRounded();
  return `<div class="tw" data-target="${target}" role="dialog" aria-label="${L.timePick}">
    <button type="button" class="tw-clear" data-act="time-off" data-target="${target}">${L.clear}</button>
    <div class="tw-main">
    <div class="tw-body">
      <div class="tw-band" aria-hidden="true"></div>
      <div class="tw-col tw-ap" id="${target}-ap" data-part="ap" tabindex="0" role="spinbutton" aria-label="${PERIODS.join(' / ')}" aria-valuetext="${PERIODS[wheelVal('ap', t)]}">${wheelItems('ap', wheelVal('ap', t))}</div>
      <div class="tw-col" id="${target}-h" data-part="h" tabindex="0" role="spinbutton" aria-label="${L.hour}" aria-valuemin="0" aria-valuemax="23" aria-valuenow="${t.h}">${wheelItems('h', t.h)}</div>
      <span class="tw-colon" aria-hidden="true">:</span>
      <div class="tw-col" id="${target}-m" data-part="m" tabindex="0" role="spinbutton" aria-label="${L.minute}" aria-valuemin="0" aria-valuemax="59" aria-valuenow="${t.m}">${wheelItems('m', t.m)}</div>
    </div>
    </div>
    <button type="button" class="btn-primary tw-ok" data-act="time-close">${L.ok}</button>
  </div>`;
}

function refreshTime(target) {
  const t = getTime(target);
  if (!t) return;
  root.querySelectorAll(`.tw[data-target="${target}"] .tw-col`).forEach(col => {
    const v = wheelVal(col.dataset.part, t);
    col.innerHTML = wheelItems(col.dataset.part, v);
    if (col.dataset.part === 'ap') col.setAttribute('aria-valuetext', PERIODS[v]);
    else col.setAttribute('aria-valuenow', v);
  });
  root.querySelectorAll(`.time-pill[data-target="${target}"]`).forEach(pill => {
    pill.classList.add('set');
    pill.innerHTML = `<span class="num">${showTime(t)}</span>`;
    pill.setAttribute('aria-label', L.timeChange(showTime(t)));
  });
}

// Minutes carry into hours: 09:59 → 10:00, and 00:00 back one → 23:59.
function stepTime(target, part, dir) {
  const t = getTime(target);
  if (!t) return;
  let next;
  // Hours run 11 → 12 into the afternoon (and 11 PM → 12 AM), switching AM/PM like the iPhone alarm.
  if (part === 'ap') { const pm = t.h >= 12; if ((dir > 0) === pm) return; next = { h: (t.h + 12) % 24, m: t.m }; }
  else if (part === 'h') next = { h: (t.h + dir + 24) % 24, m: t.m };
  else { const total = (t.h * 60 + t.m + dir + 1440) % 1440; next = { h: Math.floor(total / 60), m: total % 60 }; }
  setTime(target, next);
  refreshTime(target);
}

/* ---------- Views ---------- */

function chips(current, act) {
  return CATS.map(c => `<button type="button" class="chip" data-act="${act}" data-cat="${c.id}" aria-pressed="${current === c.id}"><i style="background:${c.color}"></i>${c.label}</button>`).join('');
}

function composer(id, cls) {
  const target = cls ? 'tnm' : 'tn';
  return `<form class="composer ${cls}" data-form="add">
    <div class="composer-row">
      <label class="sr" for="${id}">${L.newTask}</label>
      <input id="${id}" class="composer-input" placeholder="${L.newTask}" maxlength="200" autocomplete="off" enterkeyhint="done" value="${esc(S.draft)}">
      ${timePill(target)}
      <button type="submit" class="add-btn" aria-label="${L.addTask}">${ICON.plus}</button>
    </div>
    ${timeWheel(target)}
    <div class="chips" role="group" aria-label="${L.pickCat}">${chips(S.newCat, 'newcat')}</div>
  </form>`;
}

function progressView() {
  const t = today(), mk = t.slice(0, 7), yk = t.slice(0, 4);
  const now = new Date();
  const items = [
    { label: L.today, sub: F_MD.format(now), color: 'var(--orange)', s: stat(k => k === t) },
    { label: L.thisMonth, sub: F_M.format(now), color: 'var(--blue-text)', s: stat(k => k.slice(0, 7) === mk) }
  ];
  if (S.view === 'all') items.push({ label: L.thisYear, sub: F_Y.format(now), color: 'var(--green)', s: stat(k => k.slice(0, 4) === yk) });
  return `<section class="progress cols-${items.length}" aria-label="${L.progress}">${items.map(p => `
    <div class="pcard">
      <div class="ring-box">
        <svg viewBox="0 0 64 64" role="img" aria-label="${L.ring(p.label, p.s.pct, p.s.total, p.s.done)}">
          <circle cx="32" cy="32" r="26" fill="none" class="track" stroke-width="7"></circle>
          <circle cx="32" cy="32" r="26" fill="none" stroke="${p.color}" stroke-width="7" stroke-dasharray="${(RING_C * p.s.pct / 100).toFixed(1)} ${RING_C.toFixed(1)}" transform="rotate(-90 32 32)"></circle>
        </svg>
        <span class="pct num" aria-hidden="true">${p.s.pct}%</span>
      </div>
      <div class="ptext">
        <div class="head"><h2>${p.label}</h2><span class="muted">${p.sub}</span></div>
        <span class="frac num"><strong>${p.s.done}</strong> / ${p.s.total} ${L.doneWord}</span>
        <span class="counts num"><span>${L.cols[0]} ${p.s.todo}</span><span>${L.cols[1]} ${p.s.doing}</span></span>
      </div>
    </div>`).join('')}</section>`;
}

function dayButton(key, label, extra) {
  const t = today();
  const hol = holidayOf(key), wd = parse(key).getDay();
  const cls = [key === S.sel ? 'sel' : '', key === t ? 'today' : '', hol && hol.off ? 'hol' : wd === 0 ? 'sun' : wd === 6 ? 'sat' : ''].join(' ');
  const open = S.tasks.filter(x => x.date === key && x.status !== 'done').length;
  const d = parse(key);
  const aria = `${F_MD.format(d)}${hol ? ` ${hol.name}` : ''}${open ? L.openLeft(open) : ''}`;
  return `<button class="day ${cls}" data-act="pick" data-date="${key}" aria-label="${aria}" aria-pressed="${key === S.sel}">${extra || ''}<span class="n">${label}</span><span class="dots" aria-hidden="true">${dotsFor(key)}</span></button>`;
}

function calendarView() {
  const { y, m } = S.ym;
  const first = new Date(y, m, 1).getDay();
  const dim = new Date(y, m + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<span class="day"></span>';
  for (let d = 1; d <= dim; d++) cells += dayButton(ymd(new Date(y, m, d)), d);
  const mk = `${y}-${pad(m + 1)}`;
  const monthOpen = S.tasks.filter(t => (t.date || '').startsWith(mk) && t.status !== 'done').length;

  const sd = parse(S.sel);
  const ws = new Date(sd.getFullYear(), sd.getMonth(), sd.getDate() - sd.getDay());
  const mid = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + 3);
  let week = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + i);
    week += dayButton(ymd(d), d.getDate(), `<span class="w">${DAYS[i]}</span>`);
  }

  return `<section class="panel cal ${S.calOpen ? 'expanded' : ''}" aria-label="${L.calendar}">
    <div class="cal-month">
      <div class="cal-head">
        <h2>${F_YM.format(new Date(y, m, 1))}</h2>
        <div class="nav"><button data-act="month" data-d="-1" aria-label="${L.prevMonth}">${ICON.left}</button><button data-act="month" data-d="1" aria-label="${L.nextMonth}">${ICON.right}</button></div>
      </div>
      <div class="dow" aria-hidden="true">${DAYS.map((d, i) => `<span class="${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${d}</span>`).join('')}</div>
      <div class="grid7">${cells}</div>
    </div>
    <div class="week">
      <div class="cal-head">
        <h2>${F_YM.format(mid)}</h2>
        <div class="nav"><button data-act="week" data-d="-7" aria-label="${L.prevWeek}">${ICON.left}</button><button data-act="week" data-d="7" aria-label="${L.nextWeek}">${ICON.right}</button></div>
      </div>
      <div class="grid7">${week}</div>
    </div>
    <button class="cal-more" data-act="cal-toggle" aria-expanded="${S.calOpen}" aria-label="${S.calOpen ? L.collapse : L.monthView}">${S.calOpen ? ICON.up : ICON.down}</button>
    <div class="cal-foot"><span>${L.monthLeft}</span><span class="num">${L.count(monthOpen)}</span></div>
  </section>`;
}

// Date in the edit form: "11월 5일 목요일" (year added when it is not this year).
const F_LONG_Y = dtf({ year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
function editDateText(k) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(k || '')) return L.date;
  return (k.slice(0, 4) === today().slice(0, 4) ? F_LONG : F_LONG_Y).format(parse(k));
}

function card(t, ci) {
  if (S.editId === t.id && S.edit) {
    return `<form class="card edit" data-form="edit" data-id="${esc(t.id)}">
      <div class="edit-row">
        <label class="sr" for="edit-title">${L.taskName}</label>
        <input id="edit-title" class="field" maxlength="200" autocomplete="off" enterkeyhint="done" value="${esc(S.edit.title)}">
        <button type="button" class="edit-del" data-act="del" data-id="${esc(t.id)}" aria-label="${L.del}">${ICON.trash}</button>
      </div>
      <div class="edit-row">
        <label class="date-field"><span class="date-text">${editDateText(S.edit.date)}</span>
          <input id="edit-date" type="date" value="${esc(S.edit.date)}" aria-label="${L.date}"></label>
        ${timePill('te')}
      </div>
      ${timeWheel('te')}
      <div class="chips" role="group" aria-label="${L.changeCat}">${chips(S.edit.cat, 'editcat')}</div>
      <div class="row-end"><button type="button" class="btn-ghost" data-act="cancel">${L.cancel}</button><button type="submit" class="btn-primary">${L.save}</button></div>
    </form>`;
  }
  const c = CAT[t.cat] || CAT.life;
  const done = t.status === 'done';
  const prev = ORDER[ci - 1], next = ORDER[ci + 1];
  const id = esc(t.id), title = esc(t.title);
  return `<div class="swipe ${S.openSwipe === t.id ? 'open' : ''}" data-id="${id}">
    ${next ? `<div class="swipe-move to-${next}" aria-hidden="true">${ICON.rightBig}<span>${COLS[ci + 1].label}</span></div>` : ''}
    <button class="swipe-del" data-act="del" data-id="${id}" tabindex="-1" aria-label="${L.del}: ${title}">${ICON.trashBig}<span>${L.del}</span></button>
    <article class="card ${prev ? 'has-back' : ''}" data-swipe data-id="${id}" data-next="${next || ''}">
      <div class="card-main">
        <button class="title ${done ? 'done' : ''}" data-act="edit" data-id="${id}" aria-label="${L.editAria(title)}">${title}${done ? '' : ICON.pencil}</button>
        <span class="cat"><i style="background:${c.color}"></i>${c.label} · ${relLabel(t.date)}${t.time ? ` <span class="num">${esc(showTime(parseTime(t.time)) || t.time)}</span>` : ''}</span>
      </div>
      ${prev ? `<button class="arrow back" data-act="move" data-id="${id}" data-to="${prev}" aria-label="${L.backTo(title, COLS[ci - 1].label)}"><span class="back-box">${ICON.leftBig}</span></button>` : ''}
    </article>
  </div>`;
}

function boardView() {
  const vis = visibleTasks();
  const tabs = COLS.map(c => `<button data-act="tab" data-tab="${c.id}" aria-pressed="${S.tab === c.id}">${c.label} <span class="num">${vis.filter(t => t.status === c.id).length}</span></button>`).join('');
  const cols = COLS.map((c, ci) => {
    const cards = vis.filter(t => t.status === c.id);
    return `<div class="col panel ${S.tab === c.id ? 'active' : ''}">
      <div class="col-head"><span class="dot" style="background:${c.dot}" aria-hidden="true"></span><h3>${c.label}</h3><span class="count num">${cards.length}</span></div>
      ${c.id === 'todo' ? composer('new-title', '') : ''}
      ${cards.map(t => card(t, ci)).join('')}
      ${cards.length === 0 && (c.id !== 'todo' || window.matchMedia('(max-width: 760px)').matches) ? `<p class="empty">${L.empty}</p>` : ''}
    </div>`;
  }).join('');
  return `<section class="board" aria-label="${L.board}">
    ${composer('new-title-m', 'composer-m')}
    <div class="tabs" role="group" aria-label="${L.status}">${tabs}</div>
    ${cols}
  </section>`;
}

function holTag(k) {
  const h = holidayOf(k);
  return h ? ` <span class="hol-name ${h.off ? 'off' : ''}">· ${esc(h.name)}</span>` : '';
}

function headerView() {
  const isToday = S.sel === today(), day = S.view === 'day';
  const views = [
    `<button data-act="today" aria-pressed="${day && isToday}">${L.today}</button>`,
    isToday ? '' : `<button data-act="view" data-view="day" aria-pressed="${day}">${L.selDay}</button>`,
    `<button data-act="view" data-view="all" aria-pressed="${!day}">${L.all}</button>`
  ].join('');
  let account = '';
  if (DEMO) account = `<span class="badge">${L.demo}</span>`;
  else if (S.user) {
    const photo = S.user.photoURL ? `<img class="avatar" src="${esc(S.user.photoURL)}" alt="" referrerpolicy="no-referrer">` : '';
    account = `<div class="account">${photo}<button class="pill" data-act="logout">${L.logout}</button></div>`;
  }
  return `<header class="top">
    <div class="title-group"><h1>${L.title}</h1><span class="sub">${S.view === 'day' ? longDate(S.sel) + holTag(S.sel) : L.allDates}</span></div>
    <div class="top-actions">
      <div class="seg" role="group" aria-label="${L.view}">${views}</div>
      ${account}
    </div>
  </header>`;
}

function loginView() {
  return `<main class="login"><div class="login-card">
    <div class="logo">${ICON.check}</div>
    <h1>HALGGO</h1>
    <p>${L.loginText}</p>
    <button class="google" data-act="login">${ICON.google}${L.google}</button>
    ${S.error ? `<p class="err" role="alert">${esc(S.error)}</p>` : ''}
  </div></main>`;
}

function toastView() {
  if (!S.toast) return '';
  return `<div class="toast" role="status">${esc(S.toast.text)}${S.toast.undo ? `<button data-act="undo">${L.undo}</button>` : ''}</div>`;
}

function render() {
  const a = document.activeElement;
  const fid = S.focusId || (a && a.id) || null;
  let ss = null, se = null;
  if (!S.focusId && a && a.id) { try { ss = a.selectionStart; se = a.selectionEnd; } catch (e) { /* not a text field */ } }

  let html;
  if (S.mode === 'loading') html = `<p class="boot">${L.loading}</p>`;
  else if (S.mode === 'fatal') html = `<main class="login"><div class="login-card"><h1>HALGGO</h1><p>${esc(S.error)}</p><button class="google" data-act="reload">${L.retry}</button></div></main>`;
  else if (S.mode === 'login') html = loginView();
  else {
    html = `<div class="wrap">
      ${headerView()}
      ${DEMO ? `<p class="notice">${L.demoNotice}</p>` : ''}
      ${progressView()}
      <div class="main">${calendarView()}${boardView()}</div>
    </div>`;
  }
  root.innerHTML = html + toastView();

  if (fid) {
    const el = document.getElementById(fid);
    if (el) {
      el.focus({ preventScroll: true });
      if (ss != null) { try { el.setSelectionRange(ss, se); } catch (e) { /* ignore */ } }
      else if (S.focusId && el.select) { try { const n = el.value.length; el.setSelectionRange(n, n); } catch (e) { /* ignore */ } }
    }
  }
  S.focusId = null;
}

/* Phone keyboard: keep the edit form above the keyboard (scroll it into the visible part of the screen). */
function fitEdit() {
  const f = root.querySelector('form.card.edit');
  if (!f) return;
  const vv = window.visualViewport, top = vv ? vv.offsetTop : 0, h = vv ? vv.height : window.innerHeight;
  const r = f.getBoundingClientRect();
  const over = r.bottom + 12 - (top + h);
  if (over > 0) window.scrollBy({ top: Math.min(over, r.top - top - 12), behavior: 'smooth' });
}
if (window.visualViewport) {
  let kbT = null;
  window.visualViewport.addEventListener('resize', () => {
    const kb = Math.max(0, Math.round(window.innerHeight - window.visualViewport.height));
    document.documentElement.style.setProperty('--kb', kb + 'px');
    clearTimeout(kbT); kbT = setTimeout(fitEdit, 80);
  });
}

/* ---------- Actions ---------- */

let toastTimer = null;
function showToast(text, undo) {
  clearTimeout(toastTimer);
  S.toast = { text, undo };
  render();
  toastTimer = setTimeout(() => { S.toast = null; render(); }, 5000);
}

function fail() { showToast(L.saveFail); }

function syncMonth() { const d = parse(S.sel); S.ym = { y: d.getFullYear(), m: d.getMonth() }; }

function deleteTask(id) {
  const t = S.tasks.find(x => x.id === id);
  if (!t || !store) return;
  if (S.editId === id) { S.editId = null; S.edit = null; S.timeOpen = null; }
  S.openSwipe = null;
  store.remove(id).then(() => {
    const { id: _drop, ...rest } = t;
    showToast(L.deleted, rest);
  }).catch(fail);
  render();
}

let suppressClick = false;
function swallowNextClick() { suppressClick = true; setTimeout(() => { suppressClick = false; }, 400); }

root.addEventListener('click', e => {
  if (suppressClick) { e.preventDefault(); e.stopPropagation(); suppressClick = false; return; }
  let dirty = false;
  // Tapping anywhere else closes an open swipe or time wheel.
  if (S.openSwipe && !e.target.closest(`.swipe[data-id="${CSS.escape(S.openSwipe)}"] .swipe-del`)) { S.openSwipe = null; dirty = true; }
  if (S.timeOpen && !e.target.closest('.tw') && !e.target.closest('.time-pill')) { S.timeOpen = null; dirty = true; }
  const b = e.target.closest('[data-act]');
  if (!b) { if (dirty) render(); return; }
  const act = b.dataset.act, id = b.dataset.id;
  switch (act) {
    case 'login': signIn(); return;
    case 'reload': location.reload(); return;
    case 'logout': signOutFn(); return;
    case 'pick': S.sel = b.dataset.date; S.view = 'day'; syncMonth(); break;
    case 'month': {
      let m = S.ym.m + Number(b.dataset.d), y = S.ym.y;
      if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
      S.ym = { y, m }; break;
    }
    case 'week': S.sel = addDays(S.sel, Number(b.dataset.d)); S.view = 'day'; syncMonth(); break;
    case 'cal-toggle': S.calOpen = !S.calOpen; syncMonth(); break;
    case 'today': S.sel = today(); S.view = 'day'; syncMonth(); break;
    case 'view': S.view = b.dataset.view; break;
    case 'tab': S.tab = b.dataset.tab; break;
    case 'newcat': S.newCat = b.dataset.cat; break;
    case 'editcat': if (S.edit) S.edit.cat = b.dataset.cat; break;
    case 'time-open': {
      const tg = b.dataset.target;
      if (S.timeOpen === tg) { S.timeOpen = null; break; }
      S.timeBefore = getTime(tg) || null;
      if (!getTime(tg)) setTime(tg, nowRounded());
      S.timeOpen = tg; S.focusId = tg + '-h';
      break;
    }
    case 'time-close': S.timeOpen = null; break;
    // 취소: put back the time it had before the wheel opened (none → no time).
    case 'time-off': setTime(b.dataset.target, S.timeBefore || null); S.timeOpen = null; break;
    case 'move': store && store.update(id, { status: b.dataset.to }).catch(fail); if (dirty) render(); return;
    case 'del': deleteTask(id); return;
    case 'undo':
      if (S.toast && S.toast.undo && store) store.add(S.toast.undo).catch(fail);
      clearTimeout(toastTimer); S.toast = null; break;
    case 'edit': {
      const t = S.tasks.find(x => x.id === id);
      if (!t) return;
      S.editId = id; S.edit = { title: t.title, date: t.date, cat: CAT[t.cat] ? t.cat : 'life', time: parseTime(t.time) };
      S.timeOpen = null; S.focusId = 'edit-title';
      render(); setTimeout(fitEdit, 60); setTimeout(fitEdit, 400);
      return;
    }
    case 'cancel': S.editId = null; S.edit = null; S.timeOpen = null; break;
    default: if (dirty) render(); return;
  }
  render();
});

/* Time wheel: mouse wheel, drag (mouse or finger), tap a number, arrow keys. Card swipe-to-delete. */
let wheelAcc = 0;
root.addEventListener('wheel', e => {
  const col = e.target.closest('.tw-col');
  if (!col) return;
  e.preventDefault();
  const dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
  const target = col.closest('.tw').dataset.target;
  if (Math.abs(dy) >= 50) { wheelAcc = 0; stepTime(target, col.dataset.part, Math.sign(dy)); return; }
  wheelAcc += dy;
  if (Math.abs(wheelAcc) >= 50) { const dir = Math.sign(wheelAcc); wheelAcc = 0; stepTime(target, col.dataset.part, dir); }
}, { passive: false });

root.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.timeOpen) { S.timeOpen = null; render(); return; }
  const col = e.target.closest && e.target.closest('.tw-col');
  if (!col || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  e.preventDefault();
  stepTime(col.closest('.tw').dataset.target, col.dataset.part, e.key === 'ArrowUp' ? 1 : -1);
});

const DEL_W = 88;
const moveAt = card => Math.min(120, card.offsetWidth * 0.35);
let drag = null, sw = null, tabSw = null;

root.addEventListener('pointerdown', e => {
  const col = e.target.closest('.tw-col');
  if (col) {
    drag = { col, target: col.closest('.tw').dataset.target, part: col.dataset.part, y: e.clientY, startY: e.clientY, moved: false };
    try { col.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ }
    e.preventDefault();
    return;
  }
  const cardEl = e.target.closest('.card[data-swipe]');
  if (e.target.closest('.board > .tabs')) {
    tabSw = { x: e.clientX, y: e.clientY };
    return;
  }
  if (!cardEl || (e.pointerType === 'mouse' && e.button !== 0)) return;
  sw = { card: cardEl, wrap: cardEl.parentElement, id: cardEl.dataset.id, next: cardEl.dataset.next, x: e.clientX, y: e.clientY, dx: 0, active: false,
         base: cardEl.parentElement.classList.contains('open') ? -DEL_W : 0, pid: e.pointerId };
});

root.addEventListener('pointermove', e => {
  if (drag) {
    const step = ITEM_H * 0.8;
    if (Math.abs(e.clientY - drag.startY) > 4) drag.moved = true;
    while (e.clientY - drag.y <= -step) { stepTime(drag.target, drag.part, 1); drag.y -= step; }
    while (e.clientY - drag.y >= step) { stepTime(drag.target, drag.part, -1); drag.y += step; }
    return;
  }
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.active) {
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      sw.active = true;
      try { sw.card.setPointerCapture(sw.pid); } catch (er) { /* ignore */ }
      sw.card.style.transition = 'none';
      sw.wrap.classList.add('swiping');
    } else if (Math.abs(dy) > 10) { sw = null; return; } else return;
  }
  sw.dx = Math.min(sw.next && !sw.base ? sw.card.offsetWidth : 0, sw.base + dx);
  sw.card.style.transform = `translateX(${sw.dx}px)`;
  sw.wrap.classList.toggle('far', sw.dx < -sw.card.offsetWidth * 0.55);
  sw.wrap.classList.toggle('fwd', sw.dx > 0);
  sw.wrap.classList.toggle('go', sw.dx > moveAt(sw.card));
});

function endPointer(e) {
  if (tabSw) {
    const t = tabSw; tabSw = null;
    const dx = e.clientX - t.x, dy = e.clientY - t.y;
    if (e.type !== 'pointerup' || Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    // The blue highlight follows the finger: swipe right → next tab, left → previous.
    const i = ORDER.indexOf(S.tab) + Math.sign(dx);
    if (i < 0 || i >= ORDER.length) return;
    swallowNextClick();
    S.tab = ORDER[i];
    render();
    return;
  }
  if (drag) {
    const d = drag; drag = null;
    if (!d.moved && e.type === 'pointerup') {
      const r = d.col.getBoundingClientRect();
      const off = Math.round((e.clientY - (r.top + r.height / 2)) / ITEM_H);
      for (let i = 0; i < Math.abs(off); i++) stepTime(d.target, d.part, Math.sign(off));
    }
    return;
  }
  if (!sw) return;
  const s = sw; sw = null;
  if (!s.active) return;
  swallowNextClick();
  s.wrap.classList.remove('swiping', 'far', 'fwd', 'go');
  s.card.style.transition = '';
  if (e.type === 'pointerup' && s.dx < -s.card.offsetWidth * 0.55) { deleteTask(s.id); return; }
  if (e.type === 'pointerup' && s.next && s.dx > moveAt(s.card)) {
    S.openSwipe = null;
    s.card.style.transform = '';
    if (store) store.update(s.id, { status: s.next }).catch(fail);
    render();
    return;
  }
  S.openSwipe = s.dx < -DEL_W / 2 ? s.id : null;
  s.card.style.transform = '';
  render();
}
root.addEventListener('pointerup', endPointer);
root.addEventListener('pointercancel', endPointer);

root.addEventListener('input', e => {
  const el = e.target;
  if (el.classList.contains('composer-input')) S.draft = el.value;
  else if (el.id === 'edit-title' && S.edit) S.edit.title = el.value;
  else if (el.id === 'edit-date' && S.edit) { S.edit.date = el.value; const tx = el.parentElement.querySelector('.date-text'); if (tx) tx.textContent = editDateText(el.value); }
});

root.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (!store) return;
  if (f.dataset.form === 'add') {
    const title = S.draft.trim();
    if (!title) return;
    const task = { title, date: S.sel, status: 'todo', cat: S.newCat, created: Date.now() };
    if (S.draftTime) task.time = fmtTime(S.draftTime);
    store.add(task).catch(fail);
    S.draft = '';
    S.draftTime = null;
    S.timeOpen = null;
    S.tab = 'todo';
    S.focusId = f.querySelector('input').id;
    render();
  } else if (f.dataset.form === 'edit' && S.edit) {
    const title = (S.edit.title || '').trim();
    if (!title) return;
    const patch = { title, cat: S.edit.cat, time: S.edit.time ? fmtTime(S.edit.time) : '' };
    if (/^\d{4}-\d{2}-\d{2}$/.test(S.edit.date || '')) patch.date = S.edit.date;
    store.update(f.dataset.id, patch).catch(fail);
    S.editId = null; S.edit = null; S.timeOpen = null;
    render();
  }
});

// Re-render when the day changes or the layout crosses the phone breakpoint.
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);
window.matchMedia('(max-width: 760px)').addEventListener('change', () => render());

/* ---------- Boot ---------- */

if (DEMO) {
  store = demoStore();
  S.mode = 'app';
  store.subscribe(tasks => { S.tasks = tasks; render(); });
} else {
  initCloud();
}

</script>
</body>
</html>
